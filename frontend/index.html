<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoKolpak AI</title>
<style>body{margin:0;background:#10151d;color:#e8edf5;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}section{background:#192231;border:1px solid #2d3c50;border-radius:16px;padding:22px;margin:16px 0}button,input{padding:12px;border-radius:8px;border:1px solid #526780;background:#10151d;color:inherit}button{cursor:pointer;background:#2878d4;border:0}.row{display:flex;gap:12px;flex-wrap:wrap}#preview{max-width:320px;max-height:320px;margin-top:16px}.error{color:#ff8a8a}.card{display:inline-block;min-width:180px;margin:6px;padding:14px;background:#223047;border-radius:10px}</style></head>
<body><main><h1>AutoKolpak AI</h1><p>Анализ декоративного диска по фотографии. Результат не заменяет измерение и CAD-проверку.</p>
<section><input id="file" type="file" accept="image/*"><input id="diameter" type="number" min="330" max="460" placeholder="Наружный диаметр, мм"><button id="go">Анализировать</button><br><img id="preview" hidden></section>
<section id="status">Выберите фотографию.</section><section id="result" hidden></section></main>
<script>const file=document.querySelector('#file'),preview=document.querySelector('#preview'),status=document.querySelector('#status'),result=document.querySelector('#result');file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false}};document.querySelector('#go').onclick=async()=>{if(!file.files[0])return status.textContent='Выберите файл';status.textContent='Анализ выполняется…';result.hidden=true;const body=new FormData();body.append('file',file.files[0]);const d=document.querySelector('#diameter').value;if(d)body.append('reference_outer_diameter_mm',d);try{const r=await fetch('/api/predict',{method:'POST',body});const data=await r.json();if(!r.ok)throw Error(data.detail||'Ошибка API');result.innerHTML='<div class="card"><b>Семейство</b><br>'+data.family+'</div><div class="card"><b>Видимые концы спиц</b><br>'+data.spoke_count+'</div><div class="card"><b>Центр</b><br>'+data.center_type+'</div><div class="card"><b>Отделка</b><br>'+data.finish+'</div><p>'+ (data.warning||'')+'</p><pre>'+JSON.stringify(data.geometry_ratios,null,2)+'</pre>';result.hidden=false;status.textContent='Готово'}catch(e){status.innerHTML='<span class="error">'+e.message+'</span>'}}</script></body></html>
